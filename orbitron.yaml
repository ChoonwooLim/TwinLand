build:
  # Orbitron 은 deployment root 를 build context 로 사용한다 (context: 키는 무시됨).
  # backend/Dockerfile 안의 COPY 경로는 모두 root 기준 (backend/... · frontend/...).
  dockerfile: backend/Dockerfile

start:
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "*"

port: 8000

healthcheck:
  path: /health
  interval: 30
  timeout: 10
